<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="white"/>
  <style>
    .axis{stroke:#111;stroke-width:1.6}.tick{stroke:#111;stroke-width:1.4}.tx{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:20px}.lab{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:22px}.ann{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:18px}.win{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:20px;font-weight:700}.sub{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:18px}
  </style>
  <!-- target band-gap windows -->
  <rect x="120" y="50" width="515" height="590" fill="#dfeaf2"/>
  <rect x="782" y="50" width="294" height="590" fill="#dfeaf2"/>
  <!-- plot frame -->
  <rect x="120" y="50" width="1000" height="590" fill="none" class="axis"/>
  <!-- x ticks -->
  <g class="tx" text-anchor="middle">
    <line class="tick" x1="194" y1="640" x2="194" y2="650"/><text x="194" y="677">1.2</text>
    <line class="tick" x1="341" y1="640" x2="341" y2="650"/><text x="341" y="677">1.3</text>
    <line class="tick" x1="488" y1="640" x2="488" y2="650"/><text x="488" y="677">1.4</text>
    <line class="tick" x1="635" y1="640" x2="635" y2="650"/><text x="635" y="677">1.5</text>
    <line class="tick" x1="782" y1="640" x2="782" y2="650"/><text x="782" y="677">1.6</text>
    <line class="tick" x1="929" y1="640" x2="929" y2="650"/><text x="929" y="677">1.7</text>
    <line class="tick" x1="1076" y1="640" x2="1076" y2="650"/><text x="1076" y="677">1.8</text>
  </g>
  <!-- y ticks -->
  <g class="tx" text-anchor="end">
    <line class="tick" x1="110" y1="634" x2="120" y2="634"/><text x="101" y="641">−1.4</text>
    <line class="tick" x1="110" y1="555" x2="120" y2="555"/><text x="101" y="562">−1.3</text>
    <line class="tick" x1="110" y1="475" x2="120" y2="475"/><text x="101" y="482">−1.2</text>
    <line class="tick" x1="110" y1="396" x2="120" y2="396"/><text x="101" y="403">−1.1</text>
    <line class="tick" x1="110" y1="316" x2="120" y2="316"/><text x="101" y="323">−1.0</text>
    <line class="tick" x1="110" y1="237" x2="120" y2="237"/><text x="101" y="244">−0.9</text>
    <line class="tick" x1="110" y1="157" x2="120" y2="157"/><text x="101" y="164">−0.8</text>
    <line class="tick" x1="110" y1="78" x2="120" y2="78"/><text x="101" y="85">−0.7</text>
  </g>
  <!-- window labels -->
  <text class="win" x="190" y="110">Single-junction<tspan x="190" dy="28">band-gap window</tspan></text>
  <text class="sub" x="190" y="174">(~1.15–1.50 eV)</text>
  <text class="win" x="815" y="470">Tandem-top-cell<tspan x="815" dy="28">band-gap window</tspan></text>
  <text class="sub" x="815" y="535">(~1.60–1.80 eV)</text>
  <!-- representative compositions -->
  <circle cx="355" cy="613" r="11" fill="#1f77b4" stroke="#000" stroke-width="1.5"/>
  <text class="ann" x="374" y="608">CsSnI<tspan baseline-shift="sub" font-size="13">3</tspan></text>
  <rect x="563" y="620" width="22" height="22" fill="#ff7f0e" stroke="#000" stroke-width="1.5"/>
  <text class="ann" x="595" y="630">CsSn(I<tspan baseline-shift="sub" font-size="13">0.60</tspan>Br<tspan baseline-shift="sub" font-size="13">0.40</tspan>)<tspan baseline-shift="sub" font-size="13">3</tspan></text>
  <polygon points="607,108 594,133 620,133" fill="#2ca02c" stroke="#000" stroke-width="1.5"/>
  <text class="ann" x="627" y="116">CsSn<tspan baseline-shift="sub" font-size="13">0.55</tspan>Ge<tspan baseline-shift="sub" font-size="13">0.45</tspan>I<tspan baseline-shift="sub" font-size="13">3</tspan></text>
  <polygon points="919,61 935,78 919,95 903,78" fill="#d62728" stroke="#000" stroke-width="1.5"/>
  <text class="ann" x="900" y="71" text-anchor="end">CsSn<tspan baseline-shift="sub" font-size="13">0.50</tspan>Ge<tspan baseline-shift="sub" font-size="13">0.50</tspan>(I<tspan baseline-shift="sub" font-size="13">0.65</tspan>Br<tspan baseline-shift="sub" font-size="13">0.35</tspan>)<tspan baseline-shift="sub" font-size="13">3</tspan></text>
  <!-- axis labels -->
  <text class="lab" x="620" y="724" text-anchor="middle">Calibrated band gap, E<tspan font-style="italic" baseline-shift="sub" font-size="15">g</tspan> (eV)</text>
  <text class="lab" x="34" y="350" text-anchor="middle" transform="rotate(-90 34 350)">Oxidation-driving-force proxy, ΔE<tspan baseline-shift="sub" font-size="15">ox</tspan><tspan baseline-shift="super" font-size="15">proxy</tspan> (eV per Sn)</text>
</svg>